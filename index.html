<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell — private writing space</title>
  <style>
    :root { --ink:#172033; --paper:#fffdfa; --muted:#6b7280; --line:#e5e7eb; --accent:#635bff; --wash:#f5f4ff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:#f7f7fb; font:15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    button,input,textarea { font:inherit; } button { cursor:pointer; border:0; } .hidden { display:none!important; }
    #auth-view { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 10% 10%,#dedbff 0,transparent 29%),radial-gradient(circle at 90% 90%,#cbf0e6 0,transparent 30%),#fafafa; }
    .card { width:min(100%,430px); background:rgba(255,255,255,.86); backdrop-filter:blur(10px); padding:36px; border:1px solid rgba(255,255,255,.8); border-radius:22px; box-shadow:0 22px 60px rgba(34,40,70,.13); }
    .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:21px; letter-spacing:-.5px; } .mark { display:grid; place-items:center; width:32px; height:32px; border-radius:9px; color:#fff; background:var(--accent); font-family:Georgia,serif; }
    h1 { margin:26px 0 6px; font-size:30px; letter-spacing:-1px; } .sub { color:var(--muted); margin:0 0 24px; }
    label { display:block; margin:15px 0 6px; font-size:13px; font-weight:700; } input { width:100%; border:1px solid #d9dbe5; border-radius:9px; padding:11px 12px; outline:0; background:#fff; } input:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #635bff20; }
    .primary { width:100%; margin-top:20px; padding:12px; color:#fff; background:var(--accent); border-radius:9px; font-weight:750; } .primary:hover { background:#534adf; } .toggle { width:100%; margin-top:12px; color:var(--accent); background:transparent; font-size:13px; }
    .notice { min-height:22px; margin:16px 0 0; color:#b42318; font-size:13px; } .notice.ok { color:#087443; }
    #app-view { height:100vh; min-height:560px; display:grid; grid-template-columns:270px 1fr; } aside { display:flex; flex-direction:column; padding:20px 14px; color:#eef0ff; background:#20233a; } aside .logo { padding:0 8px; } aside .mark { background:#8c85ff; } .user { margin:28px 8px 15px; padding:11px; overflow:hidden; color:#bfc4df; border:1px solid #3a3e5a; border-radius:9px; font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .new { padding:10px; color:#24203e; background:#c7c2ff; border-radius:8px; font-weight:750; } .new:hover { background:#ddd9ff; } #doc-list { flex:1; overflow:auto; margin-top:17px; } .doc { width:100%; display:block; margin:3px 0; padding:10px; overflow:hidden; color:#c8cbdf; text-align:left; background:transparent; border-radius:7px; text-overflow:ellipsis; white-space:nowrap; } .doc:hover,.doc.active { color:#fff; background:#363a56; } .signout { padding:9px; color:#bfc4df; background:transparent; text-align:left; }
    main { display:flex; flex-direction:column; min-width:0; background:var(--paper); } .toolbar { display:flex; align-items:center; gap:12px; padding:18px 28px; border-bottom:1px solid var(--line); } #title { max-width:520px; padding:4px 0; border:0; border-radius:0; color:var(--ink); background:transparent; font-size:20px; font-weight:760; } #title:focus { box-shadow:none; border-bottom:2px solid var(--accent); } #status { margin-left:auto; color:var(--muted); font-size:12px; } #editor { flex:1; width:min(100%,900px); margin:0 auto; padding:58px max(30px,7vw); resize:none; border:0; outline:0; color:#263046; background:transparent; font:19px/1.8 Georgia, 'Times New Roman', serif; }
    .empty { padding:18px 9px; color:#9ca1bd; font-size:13px; } @media(max-width:680px) { #app-view { grid-template-columns:1fr; } aside { display:none; } .toolbar { padding:14px 16px; } #editor { padding:32px 22px; } }
  </style>
</head>
<body>
  <section id="auth-view">
    <form class="card" id="auth-form">
      <div class="logo"><span class="mark">I</span> Inkwell</div>
      <h1 id="auth-title">Welcome back</h1>
      <p class="sub" id="auth-subtitle">Sign in to your private writing space.</p>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters" />
      <button class="primary" id="auth-submit" type="submit">Sign in</button>
      <button class="toggle" id="auth-toggle" type="button">New here? Create an account</button>
      <p class="notice" id="auth-notice" role="status"></p>
    </form>
  </section>
  <section id="app-view" class="hidden">
    <aside>
      <div class="logo"><span class="mark">I</span> Inkwell</div>
      <div class="user" id="user-email"></div>
      <button class="new" id="new-doc">+ New document</button>
      <div id="doc-list"></div>
      <button class="signout" id="sign-out">Sign out</button>
    </aside>
    <main>
      <div class="toolbar"><input id="title" aria-label="Document title" placeholder="Untitled document" /><span id="status">Ready</span></div>
      <textarea id="editor" aria-label="Document content" placeholder="Start writing…" disabled></textarea>
    </main>
  </section>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';

    // This is a publishable browser key. Never put a service_role or secret key in this file.
    const supabase = createClient('https://ltoziqabpajenztpzqhv.supabase.co', 'sb_publishable_NpHL6PvPwQyNRqypgEsJmg_ETRaVXBJ');
    const $ = (id) => document.getElementById(id);
    const authView = $('auth-view'), appView = $('app-view'), form = $('auth-form');
    const email = $('email'), password = $('password'), notice = $('auth-notice');
    const title = $('title'), editor = $('editor'), status = $('status'), docList = $('doc-list');
    let isSignUp = false, currentUser = null, currentDoc = null, saveTimer = null;

    function message(text = '', ok = false) { notice.textContent = text; notice.className = `notice${ok ? ' ok' : ''}`; }
    function escapeHtml(value) { const el = document.createElement('div'); el.textContent = value; return el.innerHTML; }
    function setStatus(text) { status.textContent = text; }
    function setAuthMode(signUp) {
      isSignUp = signUp; message();
      $('auth-title').textContent = signUp ? 'Create your account' : 'Welcome back';
      $('auth-subtitle').textContent = signUp ? 'Your documents stay private to your account.' : 'Sign in to your private writing space.';
      $('auth-submit').textContent = signUp ? 'Create account' : 'Sign in';
      $('auth-toggle').textContent = signUp ? 'Already have an account? Sign in' : 'New here? Create an account';
      password.autocomplete = signUp ? 'new-password' : 'current-password';
    }
    async function renderDocuments(selectId) {
      const { data, error } = await supabase.from('documents').select('id,title,content,updated_at').order('updated_at', { ascending:false });
      if (error) return setStatus(error.message);
      docList.innerHTML = data.length ? data.map(d => `<button class="doc ${d.id === (selectId || currentDoc?.id) ? 'active' : ''}" data-id="${d.id}">${escapeHtml(d.title)}</button>`).join('') : '<p class="empty">No documents yet.</p>';
      docList.querySelectorAll('.doc').forEach(button => button.onclick = () => openDocument(data.find(d => d.id === button.dataset.id)));
      if (!currentDoc && data[0]) openDocument(data[0]);
    }
    function openDocument(doc) {
      currentDoc = doc; title.value = doc.title; editor.value = doc.content; editor.disabled = false;
      setStatus('Saved'); renderDocuments(doc.id);
    }
    async function newDocument() {
      const { data, error } = await supabase.from('documents').insert({ owner_id: currentUser.id, title:'Untitled document', content:'' }).select().single();
      if (error) return setStatus(error.message);
      openDocument(data); renderDocuments(data.id); title.focus(); title.select();
    }
    function scheduleSave() {
      if (!currentDoc) return; clearTimeout(saveTimer); setStatus('Saving…');
      saveTimer = setTimeout(saveDocument, 550);
    }
    async function saveDocument() {
      if (!currentDoc) return;
      const changes = { title: title.value.trim().slice(0,160) || 'Untitled document', content: editor.value, updated_at:new Date().toISOString() };
      const { data, error } = await supabase.from('documents').update(changes).eq('id', currentDoc.id).select().single();
      if (error) return setStatus(`Could not save: ${error.message}`);
      currentDoc = data; setStatus('Saved'); renderDocuments(data.id);
    }
    async function showApp(user) {
      currentUser = user; $('user-email').textContent = user.email || 'Signed in'; authView.classList.add('hidden'); appView.classList.remove('hidden');
      currentDoc = null; editor.disabled = true; editor.value = ''; title.value = ''; await renderDocuments();
    }
    function showAuth() { currentUser = null; currentDoc = null; appView.classList.add('hidden'); authView.classList.remove('hidden'); form.reset(); setAuthMode(false); }
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); message(); $('auth-submit').disabled = true;
      const credentials = { email:email.value.trim(), password:password.value };
      const result = isSignUp
        ? await supabase.auth.signUp({ ...credentials, options:{ emailRedirectTo:location.origin + location.pathname } })
        : await supabase.auth.signInWithPassword(credentials);
      $('auth-submit').disabled = false;
      if (result.error) return message(result.error.message);
      if (isSignUp && !result.data.session) return message('Check your email to confirm your account, then sign in.', true);
      if (result.data.user) showApp(result.data.user);
    });
    $('auth-toggle').onclick = () => setAuthMode(!isSignUp);
    $('new-doc').onclick = newDocument; $('sign-out').onclick = () => supabase.auth.signOut();
    title.addEventListener('input', scheduleSave); editor.addEventListener('input', scheduleSave);
    supabase.auth.onAuthStateChange((_event, session) => { if (session?.user) showApp(session.user); else showAuth(); });
    const { data:{ session } } = await supabase.auth.getSession();
    if (session?.user) showApp(session.user); else showAuth();
  </script>
</body>
</html>
