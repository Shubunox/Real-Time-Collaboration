<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell — collaborative document</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2321; --ink-soft:#4a544f; --paper:#fbfaf7; --panel:#f1efe9;
    --line:#ddd8cd; --teal:#2f6e62; --teal-soft:#e4efec; --amber:#b5762a;
    --danger:#a4432f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--paper); flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:-.01em; color:var(--teal);}
  .brand span{font-size:19px;}
  #docTitle{
    font-family:'Source Serif 4',serif; font-size:17px; font-weight:600;
    border:none; background:transparent; color:var(--ink);
    flex:1; min-width:160px; outline:none; padding:6px 4px; border-bottom:1px solid transparent;
  }
  #docTitle:focus{border-bottom:1px solid var(--teal);}
  .status{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--danger); transition:background .2s;}
  .dot.on{background:var(--teal);}
  .avatars{display:flex; margin-left:-6px;}
  .avatar{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600; color:#fff; margin-left:-6px;
  }
  button{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:7px 13px; border-radius:7px; cursor:pointer;
  }
  button:hover{border-color:var(--teal);}
  button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.primary:hover{background:#265a50;}
  main{flex:1; display:flex; overflow:hidden;}
  .editor-wrap{flex:1; display:flex; justify-content:center; overflow-y:auto; padding:40px 20px;}
  #editor{
    width:100%; max-width:680px; min-height:70vh;
    background:var(--paper); border:none; resize:none; outline:none;
    font-family:'Source Serif 4',serif; font-size:18px; line-height:1.7; color:var(--ink);
  }
  aside{
    width:260px; border-left:1px solid var(--line); background:var(--panel);
    padding:18px; overflow-y:auto; flex-shrink:0;
  }
  aside h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:0 0 10px;}
  .room-row{display:flex; gap:6px; margin-bottom:22px;}
  .room-row input{flex:1; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-family:inherit;}
  .people{display:flex; flex-direction:column; gap:8px; margin-bottom:24px;}
  .person{display:flex; align-items:center; gap:8px; font-size:13px;}
  .person .dotc{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .versions{display:flex; flex-direction:column; gap:6px;}
  .version{
    border:1px solid var(--line); border-radius:6px; padding:8px 10px;
    font-size:12.5px; background:var(--paper); cursor:pointer; display:flex; justify-content:space-between; gap:6px;
  }
  .version:hover{border-color:var(--teal);}
  .version time{color:var(--ink-soft);}
  .empty{font-size:12.5px; color:var(--ink-soft); font-style:italic;}
  footer{padding:8px 22px; font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line);}
  @media (max-width:720px){ aside{display:none;} }
</style>
</head>
<body>

<header>
  <div class="brand"><span>🪶</span>Inkwell</div>
  <input id="docTitle" placeholder="Untitled document" />
  <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">connecting…</span></div>
  <div class="avatars" id="avatars"></div>
  <button class="primary" id="shareBtn">Copy share link</button>
</header>

<main>
  <div class="editor-wrap"><textarea id="editor" spellcheck="false" placeholder="Start writing. Anyone with this link, open at the same time, edits with you live."></textarea></div>
  <aside>
    <h3>Document</h3>
    <div class="room-row">
      <input id="roomInput" placeholder="doc name…" />
      <button id="openBtn">Open</button>
    </div>

    <h3>Here now</h3>
    <div class="people" id="people"><div class="empty">Just you, so far.</div></div>

    <h3>Version history</h3>
    <button id="snapshotBtn" style="width:100%; margin-bottom:10px;">Save a version</button>
    <div class="versions" id="versions"><div class="empty">No saved versions yet.</div></div>
  </aside>
</main>

<footer>Peer-to-peer sync (WebRTC) + offline copy in this browser (IndexedDB). No account, no server of your own — data lives in participants' browsers and syncs while they're both open.</footer>

<script type="module">
import * as Y from 'https://cdn.jsdelivr.net/npm/yjs@13/+esm';
import { WebrtcProvider } from 'https://cdn.jsdelivr.net/npm/y-webrtc@10/+esm';
import { IndexeddbPersistence } from 'https://cdn.jsdelivr.net/npm/y-indexeddb@9/+esm';

const editor = document.getElementById('editor');
const docTitleEl = document.getElementById('docTitle');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const avatarsEl = document.getElementById('avatars');
const peopleEl = document.getElementById('people');
const versionsEl = document.getElementById('versions');
const roomInput = document.getElementById('roomInput');

const NAMES = ['Otter','Falcon','Heron','Fox','Lynx','Wren','Ibis','Seal'];
const COLORS = ['#2f6e62','#b5762a','#5c5aa0','#a4432f','#3b7fb0','#8a6d3b'];
const myName = NAMES[Math.floor(Math.random()*NAMES.length)] + ' ' + Math.floor(Math.random()*90+10);
const myColor = COLORS[Math.floor(Math.random()*COLORS.length)];

function currentRoom(){
  return decodeURIComponent(location.hash.slice(1)) || 'inkwell-default';
}
roomInput.value = currentRoom();

const room = currentRoom();
const ydoc = new Y.Doc();
const ytext = ydoc.getText('content');
const ymeta = ydoc.getMap('meta');
const LOCAL_ORIGIN = 'local';

const persistence = new IndexeddbPersistence('inkwell-' + room, ydoc);
const provider = new WebrtcProvider('inkwell-room-' + room, ydoc, {
  signaling: ['wss://signaling.yjs.dev', 'wss://y-webrtc-signaling-eu.herokuapp.com', 'wss://y-webrtc-signaling-us.herokuapp.com']
});
provider.awareness.setLocalStateField('user', { name: myName, color: myColor });

// ---- connection status ----
function setStatus(on, label){
  statusDot.classList.toggle('on', on);
  statusText.textContent = label;
}
setStatus(false, 'connecting…');
provider.on('status', e => setStatus(e.connected, e.connected ? 'live' : 'offline (saved locally)'));
window.addEventListener('offline', () => setStatus(false, 'offline (saved locally)'));
window.addEventListener('online', () => setStatus(provider.connected, provider.connected ? 'live' : 'reconnecting…'));

// ---- presence ----
function renderPresence(){
  const states = Array.from(provider.awareness.getStates().values()).filter(s => s.user);
  avatarsEl.innerHTML = states.map(s =>
    `<div class="avatar" style="background:${s.user.color}" title="${s.user.name}">${s.user.name[0]}</div>`
  ).join('');
  peopleEl.innerHTML = states.length
    ? states.map(s => `<div class="person"><div class="dotc" style="background:${s.user.color}"></div>${s.user.name}</div>`).join('')
    : '<div class="empty">Just you, so far.</div>';
}
provider.awareness.on('change', renderPresence);
renderPresence();

// ---- text binding (diff-based, so concurrent edits merge as real CRDT ops) ----
let lastValue = '';
function diff(oldStr, newStr){
  let start = 0;
  while (start < oldStr.length && start < newStr.length && oldStr[start] === newStr[start]) start++;
  let oldEnd = oldStr.length, newEnd = newStr.length;
  while (oldEnd > start && newEnd > start && oldStr[oldEnd-1] === newStr[newEnd-1]) { oldEnd--; newEnd--; }
  return { start, deleteCount: oldEnd - start, insertText: newStr.slice(start, newEnd) };
}
editor.addEventListener('input', () => {
  const newVal = editor.value;
  const { start, deleteCount, insertText } = diff(lastValue, newVal);
  ydoc.transact(() => {
    if (deleteCount > 0) ytext.delete(start, deleteCount);
    if (insertText) ytext.insert(start, insertText);
  }, LOCAL_ORIGIN);
  lastValue = newVal;
});
ytext.observe(event => {
  if (event.transaction.origin === LOCAL_ORIGIN) return;
  const selStart = editor.selectionStart, selEnd = editor.selectionEnd;
  const newText = ytext.toString();
  editor.value = newText;
  lastValue = newText;
  try { editor.selectionStart = selStart; editor.selectionEnd = selEnd; } catch(e) {}
});

// ---- title binding ----
docTitleEl.addEventListener('input', () => {
  ymeta.set('title', docTitleEl.value);
  document.title = (docTitleEl.value || 'Untitled document') + ' — Inkwell';
});
ymeta.observe(() => {
  if (document.activeElement !== docTitleEl) {
    docTitleEl.value = ymeta.get('title') || '';
  }
});

persistence.on('synced', () => {
  lastValue = ytext.toString();
  editor.value = lastValue;
  docTitleEl.value = ymeta.get('title') || '';
  loadVersions();
});

// ---- sharing ----
document.getElementById('shareBtn').addEventListener('click', () => {
  const url = location.origin + location.pathname + '#' + encodeURIComponent(room);
  navigator.clipboard?.writeText(url);
  const btn = document.getElementById('shareBtn');
  const original = btn.textContent;
  btn.textContent = 'Link copied';
  setTimeout(() => btn.textContent = original, 1400);
});
document.getElementById('openBtn').addEventListener('click', () => {
  const name = roomInput.value.trim() || 'inkwell-default';
  location.hash = encodeURIComponent(name);
  location.reload();
});

// ---- lightweight version snapshots (stored locally, per document) ----
const VKEY = 'inkwell-versions-' + room;
function loadVersions(){
  const list = JSON.parse(localStorage.getItem(VKEY) || '[]');
  versionsEl.innerHTML = list.length ? '' : '<div class="empty">No saved versions yet.</div>';
  list.slice().reverse().forEach(v => {
    const el = document.createElement('div');
    el.className = 'version';
    el.innerHTML = `<span>${v.label}</span><time>${new Date(v.at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</time>`;
    el.addEventListener('click', () => {
      if (!confirm('Restore this version? Current text will be replaced (still recoverable — this becomes a new edit, nothing is deleted from history).')) return;
      const { start, deleteCount, insertText } = diff(ytext.toString(), v.text);
      ydoc.transact(() => {
        if (deleteCount > 0) ytext.delete(start, deleteCount);
        if (insertText) ytext.insert(start, insertText);
      }, LOCAL_ORIGIN);
      lastValue = ytext.toString();
      editor.value = lastValue;
    });
    versionsEl.appendChild(el);
  });
}
document.getElementById('snapshotBtn').addEventListener('click', () => {
  const list = JSON.parse(localStorage.getItem(VKEY) || '[]');
  list.push({ at: Date.now(), text: ytext.toString(), label: `Version ${list.length + 1}` });
  localStorage.setItem(VKEY, JSON.stringify(list));
  loadVersions();
});

window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
